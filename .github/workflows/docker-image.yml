name: Build and Deploy mydemo-nodejs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_URI: 152216337308.dkr.ecr.ap-northeast-2.amazonaws.com/mydemo-nodejs-ecr
  CONTAINER_NAME: mydemo-nodejs-container

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-to-ecr:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          FULL_CONTAINER_IMAGE: ${{ env.ECR_REPOSITORY_URI }}:${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$FULL_CONTAINER_IMAGE" .
          docker push "$FULL_CONTAINER_IMAGE"

  deploy-to-ec2:
    needs: build-and-push-to-ecr
    runs-on: ubuntu-latest
    environment: production # Required reviewers 설정 시 승인 후 실행
    env:
      FULL_CONTAINER_IMAGE: ${{ env.ECR_REPOSITORY_URI }}:${{ needs.build-and-push-to-ecr.outputs.image_tag }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # EC2 내부에서 실행될 배포 스크립트 (EC2 Instance Profile 권한으로 ECR pull)
      - name: Prepare deploy commands
        run: |
          REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg image "$FULL_CONTAINER_IMAGE" \
            --arg name "$CONTAINER_NAME" \
            '{commands: [
              "set -e",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker stop \($name) || true",
              "docker rm \($name) || true",
              "docker run -d --name \($name) --restart unless-stopped -p 80:8080 \($image)"
            ]}' > params.json
          cat params.json

      - name: Deploy via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          # 최대 10분 대기
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          [ "$STATUS" = "Success" ]